name: ci

# Merge gate: every pull request (and every push to main) must build cleanly
# and pass the built-in self-test suite (`neolink.net selftest` — protocol
# codecs, config, recording, auth, MQTT, and the live web-API contract test).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (tags can be repointed if an
      # action repo is ever compromised); the comment tracks the release.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build src/Neolink.Server/Neolink.Server.csproj -c Release -warnaserror -nologo

      - name: Self-tests
        run: dotnet src/Neolink.Server/bin/Release/net10.0/neolink.net.dll selftest

  # The Windows desktop shell is the tree's only Windows-only project (WebView2
  # + WinForms); the Linux job above builds the server csproj directly and never
  # has to know it exists. It gets its own runner and its own self-test.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build src/Neolink.Desktop/Neolink.Desktop.csproj -c Release -warnaserror -nologo

      - name: Self-tests
        run: |
          $exe = "src/Neolink.Desktop/bin/Release/net10.0-windows10.0.19041.0/Neolink.Desktop.exe"
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      # Proves the installer still builds and that the app publishes
      # self-contained. Not uploaded here - releases carry the MSI (docker.yml).
      - name: Installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          ./installer/build-msi.ps1
        shell: pwsh
