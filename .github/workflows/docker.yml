name: docker

on:
  push:
    # main -> :latest (+ the release tags below). beta -> :beta, a rolling test
    # channel users can opt into (ghcr.io/.../neolink.net:beta) without touching
    # stable; the :beta tag comes from the type=ref,event=branch rule below.
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Skip pointless rebuilds: a BRANCH push that only touches docs/manifests
  # (README, CHANGELOG, the add-on manifests, ...) doesn't change the app image,
  # so main won't republish :latest for them. Tags (releases) and manual runs
  # always build — path filters on the `push` trigger itself would risk skipping
  # a doc-heavy release commit, so the decision lives here instead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: f
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == 0000000000000000000000000000000000000000 ]] \
               || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0   # no base to diff against: build to be safe
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" \
               | grep -qvE '(\.md$|^neolink-addon/|^neolink-beta/|^unraid/|^docs/|^LICENSE$|^repository\.yaml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: gate
    if: needs.gate.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs (tags can be repointed if an
      # action repo is ever compromised); the comment tracks the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # amd64 + arm64 (Raspberry Pi / ARM NAS boxes are common camera hosts)
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags (vX.Y.Z) become the app's self-reported version; beta
      # branch builds report "<csproj version>-beta.<run>" so every beta push
      # is unmistakable AND unique everywhere the version shows (web UI,
      # startup log, /api/features) — without consuming stable patch numbers:
      # the csproj stays at the NEXT stable version for the whole beta cycle,
      # and each stable release increments by exactly one. The Dockerfile
      # falls back to the csproj <Version> when this is empty (local builds).
      - id: ver
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/beta'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Neolink.Server/Neolink.Server.csproj)
            echo "version=${v%-beta}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Windows desktop app's MSI rides the same release tag as the docker
  # images, so the installer on the release page and the server image always
  # carry the same vX.Y.Z. Beta pushes build one too, kept as a workflow
  # artifact — testable without being published to users. Release tags don't
  # run ci.yml, so the desktop selftest is repeated here: an installer must
  # not package an app that fails its own checks.
  desktop-msi:
    needs: gate
    if: >-
      needs.gate.outputs.app == 'true'
      && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/beta')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build and self-test
        shell: pwsh
        run: |
          dotnet build src/Neolink.Desktop/Neolink.Desktop.csproj -c Release -warnaserror -nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # WinExe (GUI subsystem): PowerShell does not wait for it and never
          # sets $LASTEXITCODE, so the build's 0 above would mask a failing
          # selftest — only Start-Process -Wait sees the real result.
          $p = Start-Process -FilePath "src/Neolink.Desktop/bin/Release/net10.0-windows10.0.19041.0/Neolink.Desktop.exe" `
            -ArgumentList '--selftest' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      # Same version rules as the docker image: the tag IS the version; beta
      # builds report "<csproj version>-beta.<run>" (build-msi.ps1 reduces that
      # to the numeric X.Y.Z for the MSI's ProductVersion, and the app itself
      # still reports the full string).
      - id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            "version=$($env:GITHUB_REF_NAME.Substring(1))" >> $env:GITHUB_OUTPUT
          } else {
            $v = [regex]::Match((Get-Content src/Neolink.Server/Neolink.Server.csproj -Raw),
              '<Version>(.*?)</Version>').Groups[1].Value
            "version=$($v -replace '-beta$','')-beta.$($env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_OUTPUT
          }

      - name: Package MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          ./installer/build-msi.ps1 -Version "${{ steps.ver.outputs.version }}"

      # The release page is written by hand (the changelog section is pasted
      # in); when the tag arrives first, a draft is created to receive the MSI
      # and publishing it stays a human decision.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME `
              --notes "Draft created by CI to carry the MSI - paste the changelog section here before publishing."
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem artifacts/*.msi).FullName --clobber

      - name: Keep the beta MSI as a workflow artifact
        if: github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Neolink.NET.Desktop-${{ steps.ver.outputs.version }}
          path: artifacts/*.msi
          retention-days: 30

  # The launcher runs at every add-on boot for every user, and nothing else
  # executes it before an image ships — a jq typo in its options mapping would
  # crash-loop them all. Run it against fixtures before publishing.
  addon-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash neolink-addon/tests/check.sh

  # Home Assistant add-on images: the app image plus the options/MQTT launcher
  # (see neolink-addon/). The Supervisor installs prebuilt per-arch images —
  # ghcr.io/borexola/neolink.net-addon-{arch}:<version> — where <version> must
  # equal the `version:` in the add-on's config.yaml.
  # Built on release tags (:X.Y.Z), the beta branch (rolling :beta, from the
  # neolink.net:beta app image) and workflow_dispatch (:edge, from :latest).
  addon:
    needs: [gate, build-and-push, addon-check]
    # Runs on release tags, the beta branch and manual dispatch. always() lets it
    # proceed even when build-and-push was SKIPPED (a docs-only beta push, where it
    # rebuilds from the existing app image) — but not when that build FAILED, and
    # never when the launcher smoke test did.
    if: >-
      always()
      && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/beta' || github.event_name == 'workflow_dispatch')
      && needs.build-and-push.result != 'failure'
      && needs.addon-check.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag/base of the add-on image, mirroring the app image it wraps:
      #   release tag v*  -> the semver (must match the release add-on's version)
      #   beta branch     -> rolling :beta (from the neolink.net:beta app image)
      #   manual dispatch -> :edge on top of :latest, never a version users get
      - id: addonver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "base=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/beta ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "base=ghcr.io/${{ github.repository }}:beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
            echo "base=ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: neolink-addon
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}-addon-${{ matrix.arch }}:${{ steps.addonver.outputs.tag }}
          build-args: |
            BUILD_FROM=${{ steps.addonver.outputs.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
